<div class="course-card" [ngClass]="cardClasses" [ngStyle]="borderStyle" appHighlight="yellow">
  <h3>{{ course.name }}</h3>
  <p>{{ course.code }} — {{ course.credits | creditLabel }}</p>

  <span [ngSwitch]="course.gradeStatus" class="badge">
    <span *ngSwitchCase="'passed'" class="badge--passed">Passed</span>
    <span *ngSwitchCase="'failed'" class="badge--failed">Failed</span>
    <span *ngSwitchCase="'pending'" class="badge--pending">Pending</span>
  </span>

  <div class="actions">
    <button (click)="onEnrollClick()">{{ isEnrolled() ? 'Unenroll' : 'Enroll' }}</button>
    <button (click)="toggleExpanded()">Show Details</button>
  </div>

  <div *ngIf="isExpanded" class="details">
    <p>Course ID: {{ course.id }}</p>
  </div>
</div>
